local_backend:
  url: http://127.0.0.1:8081/api/v1
  allowed_hosts: ["127.0.0.1", "localhost"]
site_url: https://3room.kr
display_url: https://3room.kr
logo_url: /images/brand/logo.png

backend:
  name: github
  repo: lab486486/triple
  branch: main
  base_url: https://3room.kr
  auth_endpoint: api/auth
  commit_messages:
    create: "{{collection}}에 {{slug}} 추가"
    update: "{{collection}} {{slug}} 수정"
    delete: "{{collection}} {{slug}} 삭제"
    uploadMedia: "사진 올림 {{path}}"
    deleteMedia: "사진 지움 {{path}}"

media_folder: public/images/uploads
public_folder: /images/uploads
media_library:
  name: r2
  config:
    upload_url: /api/upload
    public_base_url: https://pub-776d8a270e67409bb1704e375af76a79.r2.dev

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: stays
    label: 숙소
    label_singular: 숙소
    folder: src/content/stays
    create: true
    delete: true
    slug: "{{nameEn | slugify}}"
    identifier_field: nameKo
    extension: md
    format: yaml-frontmatter
    summary: "{{nameKo}} · {{city}}/{{area}}"
    sortable_fields: ["nameKo", "city", "rank", "updated"]
    view_groups:
      - label: 도시
        field: city
    fields:
      - { name: nameKo, label: 숙소 이름 (한글), widget: string, hint: "상세 페이지 큰 제목입니다." }
      - { name: nameEn, label: 숙소 이름 (영문, 파일명·검색용), widget: string, hint: "Minn Ueno 처럼. URL 슬러그가 됩니다." }
      - name: city
        label: 도시
        widget: select
        hint: "제목 위 꼬리표(우에노 · 도쿄)에 쓰입니다."
        options:
          - { label: 도쿄, value: tokyo }
          - { label: 오사카, value: osaka }
          - { label: 교토, value: kyoto }
          - { label: 후쿠오카, value: fukuoka }
      - name: area
        label: 지역
        widget: select
        hint: "제목 위 꼬리표에 쓰입니다."
        options:
          - { label: 우에노, value: ueno }
          - { label: 긴자(도쿄역), value: ginza }
          - { label: 신주쿠(시부야), value: shinjuku }
          - { label: 난바, value: namba }
          - { label: 교토역, value: station }
          - { label: 하카타, value: hakata }
      - name: photos
        label: 숙소 사진
        widget: list
        required: false
        hint: "상세 상단 갤러리입니다. R2에 올린 주소가 그대로 들어갑니다."
        field: { name: photo, label: 사진, widget: image }
      - { name: price_band, label: 가격대(만원), widget: number, value_type: int, default: 10, min: 1, hint: "10 만 넣으면 화면에 10만원대로 나갑니다." }
      - { name: trip_hotel, label: 트립닷컴 호텔번호, widget: string, required: false, hint: "hotelId 숫자 또는 상세 주소를 넣으면 그 호텔이 성인 3인 기준으로 열립니다. 비우면 영문 숙소명으로 검색합니다." }
      - { name: official_url, label: 공식 사이트, widget: string, required: false }
      - { name: verdict, label: 한줄 평가, widget: text, hint: "별점 카드 아래 문구입니다. 별점(9.0 이상)은 숙소마다 자동으로 붙습니다." }
      - { name: address, label: 주소, widget: string, hint: "위치 정보 카드와 지도보기 링크에 나갑니다." }
      - { name: transit, label: 교통, widget: string, hint: "우에노역(5분 소요) 처럼 한 줄로 적습니다." }
      - { name: check_in, label: 입실, widget: string, default: "15:00", hint: "객실 카드에 '입실 15:00'으로 나갑니다." }
      - { name: check_out, label: 퇴실, widget: string, default: "11:00", hint: "객실 카드에 '퇴실 11:00'으로 나갑니다." }
      - name: amenities
        label: 서비스 및 부대시설
        widget: select
        multiple: true
        required: false
        default:
          - 무선인터넷
          - 욕실용품
          - TV
          - 에어컨
          - 샤워실
          - 금연
          - 엘리베이터
          - 카드결제
          - 드라이기
        hint: "고른 항목이 상단 카드(6개)와 숙소 소개 아래 아이콘 목록으로 나갑니다. 비우면 기본 시설이 들어갑니다."
        options:
          - 무선인터넷
          - 욕실용품
          - TV
          - 에어컨
          - 샤워실
          - 금연
          - 엘리베이터
          - 카드결제
          - 드라이기
          - 수영장
          - 야외수영장
          - 사우나
          - 레스토랑
          - 카페
          - 무료주차
          - 주차장
          - 공용스파
          - 스프링클러
      - name: rooms
        label: 객실 선택 (3인실만)
        widget: list
        required: false
        hint: "트윈·스탠다드는 넣지 마세요. 3명이 눕는 타입만. 객실 선택 카드와 지역 표에 그대로 나갑니다."
        summary: "{{name}} · {{beds}}"
        fields:
          - { name: name, label: 타입 이름, widget: string, hint: "객실 카드 제목" }
          - { name: beds, label: 침대 구성, widget: string }
          - { name: size_sqm, label: 면적(㎡), widget: number, value_type: int, required: false, min: 1 }
          - { name: capacity_comfortable, label: 편안하게 자는 인원, widget: number, value_type: int, min: 1 }
          - name: party_types
            label: 이 타입이 맞는 동행
            widget: select
            multiple: true
            required: false
            options:
              - { label: 부부+자녀, value: couple_child }
              - { label: 성인 3인, value: three_adults }
          - { name: note, label: 객실 메모, widget: text, hint: "객실 카드 설명으로 나갑니다." }
          - { name: photo, label: 객실 사진, widget: image, required: false, hint: "없으면 숙소 대표 사진을 씁니다." }
      - { name: body, label: 숙소 소개, widget: markdown, hint: "숙소 소개 본문입니다." }
      - name: party_types
        label: 맞는 동행
        widget: select
        multiple: true
        min: 1
        options:
          - { label: 부부+자녀, value: couple_child }
          - { label: 성인 3인, value: three_adults }
      - name: sleep_layout
        label: 대표 침대 구성
        widget: select
        options:
          - { label: 더블+싱글, value: apartment }
          - { label: 싱글 X 3, value: triple_bed }
          - { label: 다다미, value: futon_3 }
          - { label: 엑스트라베드, value: twin_extra }
      - { name: capacity_comfortable, label: 편안하게 자는 인원, widget: number, value_type: int, min: 1 }
      - { name: room_size_sqm, label: 대표 면적(㎡), widget: number, value_type: int, min: 1 }
      - { name: rank, label: 지역 안 순위, widget: number, value_type: int, min: 1, default: 1 }
      - { name: featured, label: 도시 대표로 쓰기, widget: boolean, default: false }
      - { name: updated, label: 확인한 날짜, widget: datetime, date_format: YYYY-MM-DD, time_format: false, picker_utc: true }

  - name: guides
    label: 블로그
    label_singular: 글
    folder: src/content/guides
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: title
    extension: md
    format: yaml-frontmatter
    summary: "{{title}}"
    sortable_fields: ["title", "date"]
    fields:
      - { name: title, label: 제목, widget: string }
      - label: 날짜
        name: date
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
        picker_utc: true
        default: "{{now}}"
        hint: "기본값은 오늘입니다. 클릭해서 바꿀 수 있습니다."
      - { name: description, label: 설명, widget: text, hint: "목록과 검색 결과에 보이는 한 줄입니다." }
      - { name: cover_image, label: 커버 이미지, widget: image, required: false }
      - { name: kicker, label: 꼬리표, widget: string, default: 블로그, hint: "카드 위에 작게 붙는 말. 예: 블로그" }
      - { name: body, label: 본문, widget: markdown, hint: "숙소 고르는 법, 지역 팁 등 글을 작성합니다." }

  - name: cities
    label: 도시
    label_singular: 도시
    folder: src/content/cities
    create: true
    slug: "{{nameEn | slugify}}"
    identifier_field: nameKo
    extension: md
    format: yaml-frontmatter
    fields:
      - { name: nameKo, label: 도시 이름, widget: string }
      - { name: nameEn, label: 영문 (파일명), widget: string }
      - { name: title, label: 페이지 제목, widget: string, hint: "도쿄 숙소 3인" }
      - { name: description, label: 메타 설명, widget: text }
      - { name: kicker, label: 꼬리표, widget: string }
      - { name: lede, label: 리드, widget: text }
      - { name: sort, label: 정렬, widget: number, value_type: int, min: 1 }
      - name: faqs
        label: FAQ
        widget: list
        fields:
          - { name: q, label: 질문, widget: string }
          - { name: a, label: 답, widget: text }
      - { name: body, label: 본문, widget: markdown }

  - name: areas
    label: 지역
    label_singular: 지역
    folder: src/content/areas
    create: true
    slug: "{{city}}-{{slug}}"
    identifier_field: nameKo
    extension: md
    format: yaml-frontmatter
    fields:
      - name: city
        label: 도시
        widget: select
        options:
          - { label: 도쿄, value: tokyo }
          - { label: 오사카, value: osaka }
          - { label: 교토, value: kyoto }
          - { label: 후쿠오카, value: fukuoka }
      - { name: slug, label: 지역 슬러그, widget: string, hint: "ueno, namba, station, hakata" }
      - { name: nameKo, label: 지역 이름, widget: string }
      - { name: nameEn, label: 영문, widget: string }
      - { name: title, label: 페이지 제목, widget: string }
      - { name: description, label: 메타 설명, widget: text }
      - { name: kicker, label: 꼬리표, widget: string }
      - { name: why, label: 왜 이 지역인지, widget: text }
      - { name: sort, label: 정렬, widget: number, value_type: int, min: 1 }
      - name: faqs
        label: FAQ
        widget: list
        fields:
          - { name: q, label: 질문, widget: string }
          - { name: a, label: 답, widget: text }
      - { name: body, label: 본문, widget: markdown }

  - name: chains
    label: 체인
    label_singular: 체인
    folder: src/content/chains
    create: true
    slug: "{{nameEn | slugify}}"
    identifier_field: nameKo
    extension: md
    format: yaml-frontmatter
    fields:
      - { name: nameKo, label: 체인 이름, widget: string }
      - { name: nameEn, label: 영문, widget: string }
      - { name: title, label: 페이지 제목, widget: string }
      - { name: description, label: 메타 설명, widget: text }
      - { name: official_url, label: 공식 사이트, widget: string }
      - { name: body, label: 본문, widget: markdown }
